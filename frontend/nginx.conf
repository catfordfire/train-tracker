server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend — avoids CORS issues and hides backend port
    location /api/ {
        proxy_pass http://backend:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://backend:8889/health;
    }

    # React SPA: all non-file routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
